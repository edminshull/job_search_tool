# Dependabot configuration.
#
# START HERE, BECAUSE THIS REPOSITORY IS A FORK
# ---------------------------------------------
# Dependabot pull requests are switched OFF BY DEFAULT for forks (GitHub made
# that change in November 2022). Nothing in this file does anything at all until
# they are turned on in THIS fork's own settings:
#
#   Settings -> Code security -> Dependabot -> Dependabot version updates -> Enable
#
# This file must also be present on the default branch (main) before Dependabot
# reads it, so merge it first and enable the setting second. Dependabot alerts
# and security updates are separate switches on the same page, and are also off
# in this fork today.
#
# WHY GROUPS
# ----------
# One PR per dependency would mean a dozen open PRs a day at a daily schedule,
# and the whole point of this repo's setup is that every PR gets read and tested
# locally before it is merged. Grouping minor and patch bumps into a single PR
# keeps that sustainable. Majors are deliberately NOT grouped: those are the ones
# that need a human, a changelog read and a real local test run.
#
# SCHEDULE AND THE PR LIMIT
# -------------------------
# Daily at 07:00 Europe/London, as requested. Note `day:` is a WEEKLY-only field
# (GitHub documents it that way; the JSON schema does not enforce it), so it is
# deliberately absent from all three blocks below — leaving it in with
# `interval: daily` would be silently ignored at best.
#
# open-pull-requests-limit IS PER ECOSYSTEM, NOT PER REPOSITORY. That is the trap
# worth knowing: the `5` in each of the three blocks allows up to FIVE OPEN PRS
# PER ECOSYSTEM, so the real ceiling here is 15, not 5. There is no
# repository-wide setting to cap the total.
#
# In practice the grouping above is what keeps the number low: minor+patch
# updates collapse into one PR per ecosystem, so a quiet day is ~3 PRs (one per
# ecosystem) and the limit only binds once several MAJORS are open at once. If a
# hard ceiling of 5 matters more than per-ecosystem headroom, split the numbers
# by hand — e.g. pip 3 / npm 1 / github-actions 1 — and accept that whichever
# ecosystem is capped will simply stop raising new PRs until one is merged or
# closed.
version: 2

updates:
  # --- Python -----------------------------------------------------------------
  # requirements.txt is at the repository root, so the directory is "/".
  #
  # `versioning-strategy: increase` is load-bearing here. requirements.txt uses
  # lower-bound ranges (`httpx>=0.27`, `pypdf>=5.0`), and Dependabot's default
  # for a range that already admits the new version is to do nothing — so the
  # default would open exactly zero pull requests. `increase` raises the floor,
  # which is also what makes the update actually installable, and therefore
  # testable, locally.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    versioning-strategy: increase
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(py)"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- The board --------------------------------------------------------------
  # package-lock.json is committed, so an npm PR carries the lockfile change
  # with it and `npm ci` in CI tests the exact dependency tree the PR proposes.
  # The ecosystem is npm even though the app lives in web/ — the directory
  # field is what points at it.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- The workflows themselves ----------------------------------------------
  # Keeps actions/checkout, setup-python, setup-node and upload-artifact current
  # in .github/workflows/. Worth having: a stale action is a supply-chain risk in
  # the one place that already has credentials.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
