  # NOTE (2026-09-23): Wayve is ALSO already registered above (greenhouse/wayve)
  # and is deliberately not listed twice. It maintains a board on greenhouse AND
  # one on ashby carrying the same postings; only greenhouse is registered, so the
  # board is not fetched twice per run. This is the duplicate-entry bug this file
  # was cleaned of on the same date — worth knowing because "it is on two ATSes"
  # is a normal thing for a growing company, not an error.
