  # Added 2026-09-23 on request. Kainos is a Belfast-HQ'd UK digital services
  # company (LSE-listed, ~3,000 staff) that runs Workday for its own careers
  # site — and also SELLS Workday services, which is why so many of its postings
  # are Workday-consultancy roles rather than engineering ones.
  #
  # TWO TRAPS, both checked live before this entry was written:
  #
  #   1. "kainos" EXISTS as a Workable account and as a SmartRecruiters company,
  #      and both return HTTP 200 — with `"jobs": []`. Verified empty, so a
  #      workable or smartrecruiters entry here would look healthy and silently
  #      contribute nothing forever. Their real board is Workday.
  #   2. Workday's list endpoint reports `locationsText: "5 Locations"` for
  #      multi-site roles, including several UK test roles. That string fails the
  #      location allowlist, so those postings would be dropped on arrival even
  #      though one of the sites is London. ats_clients.fetch_workday expands the
  #      detail for relevant titles to recover the real location — see its
  #      docstring. Belfast/Birmingham-only roles are still correctly rejected.
  #
  # Slug is `tenant/site` (from kainos.wd3.myworkdayjobs.com/kainos). `search`
  # is a server-side text filter applied to the whole posting, not a title match:
  # it is how this entry asks for the concept rather than guessing titles, and it
  # is what keeps a 125-posting consultancy board from becoming 125 detail
  # fetches. Drop the `search` line to scan the entire board instead.
  - name: "Kainos"
    ats: workday
    slug: kainos/kainos
    search: "test"

  # Added 2026-09-23 on request ("I can see a QA role on there now").
  #
  # TWO boards exist for Trading 212 and only one is live:
  #   ashby     trading212  -> 67 postings, incl. Senior Quality Assurance
  #                            Engineer in London (the role Ed saw)
  #   personio  trading212  -> a stale feed whose only London entry is a
  #                            "General Application" created 2018-10-22, with
  #                            no QA or engineering roles at all
  # So `ats: ashby` is the correct one. The Personio host still resolves and
  # returns HTTP 200, which is exactly the trap: it would look configured and
  # contribute nothing.
  - name: "Trading 212"
    ats: ashby
    slug: trading212

  # ---------------------------------------------------------------------------
  # UK additions, 2026-09-23. Every slug below was PROBED LIVE before being
  # written here, and each is recorded with what it actually had on the day —
  # because this file's history shows the failure mode clearly: a board that
  # returns HTTP 200 with an empty list looks perfectly configured and
  # contributes nothing forever (see the Kainos and Trading 212 notes above, and
  # the 19 entries removed on this date for exactly that).
  #
  # Group A — a live UK QA role at the time of writing
  # Group B — UK-active boards with real London engineering roles but no QA
  #           opening yet. Added because a QA role appearing later is then caught
  #           automatically; they contribute nothing until one does.
  # ---------------------------------------------------------------------------

